# Ironkeeper continuous integration.
#
# The workflow runs on every push to any branch and on every pull
# request. It performs no deployment, publishes no release, needs no
# credentials and touches no storage device.
#
# The build and the tests run natively on GitHub-hosted Linux runners:
# `ubuntu-24.04` for amd64 and `ubuntu-24.04-arm` for arm64. No
# cross-architecture emulation is used, so an arm64 result is a genuine
# arm64 execution.

name: ci

on:
  push:
    branches:
      - main
      - "act/**"
  pull_request:
  workflow_dispatch:

# Least privilege: the workflow reads the repository and runs a build.
# It has no write access to the repository and needs no secret.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  NIM_VERSION: "2.4.2"
  # The official Nim distributions are per-architecture. The sha256 of each
  # is the one published alongside it at
  # https://nim-lang.org/download/nim-<version>-linux_<arch>.tar.xz.sha256
  # and is verified before the toolchain is used.
  NIM_SHA256_AMD64: "0ee5b16e81852a956d4fddb4aa44b5958c645c992132fa43be45f489573ee325"
  NIM_SHA256_ARM64: "58e86d84e679d003ec04320b2411cd10aefd942132f9eaf6c583012b22be3595"
  # The pinned validator. The commit is the exact tree that was qualified
  # against the official JSON Schema Test Suite; see
  # docs/architecture/overview.md, "Validator qualification".
  JSCHEMA_COMMIT: "a936862556f24fde475059c560c1a13f00291457"
  # sha256 of `git archive` of that commit, which pins the whole tree.
  JSCHEMA_TREE_SHA256: "323f47f85dba93a0f96bd3ffd6ec964abe2663e260c988596d7a49a0d68573a8"
  # The gitleaks binary used for secret scanning. MIT licensed; the binary
  # is used rather than the action because the action requires a
  # commercial licence for organisation-owned repositories.
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  # ---------------------------------------------------------------------
  # The authoritative build, test and validation gate.
  #
  # The same repository-owned entry points are used locally and here:
  # `tools/build.sh` and the three test binaries it produces. There is no
  # second implementation of the test suite for CI.
  # ---------------------------------------------------------------------
  build-test:
    name: build and test (${{ matrix.architecture }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: amd64
          - runner: ubuntu-24.04-arm
            architecture: arm64
    steps:
      - name: Check out the repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install the pinned Nim toolchain
        run: |
          set -euo pipefail
          # The bootstrap is the repository-owned script, so that CI and
          # the regression check exercise the same code. The official Nim
          # distribution is per-architecture, and the runner's own
          # architecture selects it: downloading the x86-64 distribution
          # on an arm64 runner produces a binary that cannot be executed.
          #
          # The script is *executed*, so its exported PATH belongs to the
          # child process. The later steps learn about the toolchain
          # through `$GITHUB_PATH`, which the runner reads for every
          # following step.
          tools/install_nim_toolchain.sh

      - name: Verify the pinned toolchain
        run: tools/verify_nim_toolchain.sh

      # std/re, which the JSON Schema validator uses for `pattern`, loads
      # PCRE dynamically at run time. The Nim distribution does not bundle
      # it, so the shared library is a runtime dependency of the
      # application and must be installed explicitly.
      - name: Install the PCRE runtime dependency
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpcre3
          ldconfig -p | grep -i pcre

      - name: Record the exact execution environment
        run: |
          set -euo pipefail
          {
            echo "architecture: ${{ matrix.architecture }}"
            echo "runner: ${{ matrix.runner }}"
            echo "runner_arch: $(uname -m)"
            echo "os: $(uname -srm)"
            echo "image: ${ImageOS:-unknown} ${ImageVersion:-unknown}"
            echo "nim_version: $(nim --version | head -1)"
            echo "nimble_version: $(nimble --version | head -1)"
            echo "cc_version: $(gcc --version | head -1)"
          } | tee environment.txt
          cat environment.txt

      - name: Resolve pinned dependencies
        run: |
          set -euo pipefail
          # The single external dependency is fetched at an exact commit
          # and its tree digest is verified. The digest pins the whole
          # tree, so a rewritten tag or a changed file is detected.
          rm -rf "$RUNNER_TEMP/jschema"
          git clone --quiet https://github.com/Niminem/jschema.git \
            "$RUNNER_TEMP/jschema"
          git -C "$RUNNER_TEMP/jschema" checkout --quiet "${JSCHEMA_COMMIT}"
          actual=$(git -C "$RUNNER_TEMP/jschema" archive HEAD | sha256sum | cut -d" " -f1)
          echo "jschema tree digest: ${actual}"
          test "${actual}" = "${JSCHEMA_TREE_SHA256}"
          # Place it where Nimble expects a developed package.
          mkdir -p "$HOME/.nimble/pkgs2/jschema-0.1.0"
          cp -R "$RUNNER_TEMP/jschema/src" "$HOME/.nimble/pkgs2/jschema-0.1.0/src"
          cp "$RUNNER_TEMP/jschema/LICENSE" "$HOME/.nimble/pkgs2/jschema-0.1.0/"
          cp "$RUNNER_TEMP/jschema/jschema.nimble" \
            "$HOME/.nimble/pkgs2/jschema-0.1.0/jschema.nimble"
          printf '%s\n' 'requires "jschema == 0.1.0"' \
            > "$HOME/.nimble/pkgs2/jschema-0.1.0/nimble.paths"
          # The dependency path is exported so that every later step
          # resolves the same dependency. The gate and build scripts also
          # derive the default location themselves, so the build does not
          # depend on this export.
          echo "IRK_DEPS_PATH=$HOME/.nimble/pkgs2/jschema-0.1.0/src" \
            >> "$GITHUB_ENV"
          {
            echo "dependency: jschema"
            echo "commit: ${JSCHEMA_COMMIT}"
            echo "tree_sha256: ${actual}"
            echo "expected_tree_sha256: ${JSCHEMA_TREE_SHA256}"
          } > dependency-resolution.txt
          cat dependency-resolution.txt
          ls -la "$HOME/.nimble/pkgs2/jschema-0.1.0"

      - name: Type-check, build and test
        run: tools/gate_build_test.sh

      - name: Verify the embedded schemas match the repository
        run: tools/gate_schema_drift.sh

      # The fault-injection harness exercises the *actual* production gate
      # scripts with controlled failing dependencies. It is lightweight: it
      # needs no network and no hardware, so it runs on every change.
      - name: Fault-inject the production gates
        run: tools/gate_fault_injection.sh

      # The bootstrap that installs the toolchain is the one the CI job
      # itself uses, and the regression check exercises it against a
      # synthetic toolchain. The predecessor ACT failed in CI because the
      # bootstrap appended the toolchain directory to `$PATH` as if PATH
      # were a file.
      - name: Check the CI toolchain bootstrap
        run: tools/gate_ci_bootstrap.sh

      # The requalification decision decides whether the validator
      # qualification has to run. A decision that says "not needed" when
      # the change evidence is missing would silently skip a mandatory
      # qualification, so the decision is exercised here against small
      # temporary repositories.
      - name: Check the requalification decision
        run: tools/gate_requalification_decision.sh

      # The qualification consumes the corpus *and* the remote schemas of
      # the pinned suite. The check proves that a changed remote input is
      # detected and that a malformed remote schema is refused.
      - name: Check the qualification input integrity
        run: tools/gate_remote_schema_integrity.sh

      # The independent validator is installed into a dedicated virtual
      # environment in its own step, and every step that uses it refers
      # to it by absolute path. A bare `pip install` places the console
      # script in a location that is not on PATH on every runner image,
      # which produced a "command not found" failure on the arm64
      # runner.
      - name: Install the independent schema validator
        run: |
          set -euxo pipefail
          python3 -m venv "$RUNNER_TEMP/validator-venv"
          "$RUNNER_TEMP/validator-venv/bin/pip" install --quiet \
            --disable-pip-version-check "check-jsonschema==0.31.2"
          "$RUNNER_TEMP/validator-venv/bin/check-jsonschema" --version
          ls -la "$RUNNER_TEMP/validator-venv/bin"

      - name: Independent schema validation and cross-check
        env:
          IRK_VALIDATOR: ${{ runner.temp }}/validator-venv/bin/check-jsonschema
        run: tools/gate_independent_check.sh

      - name: Release-mode compilation
        run: |
          set -euo pipefail
          export IRK_DEPS_PATH="$HOME/.nimble/pkgs2/jschema-0.1.0/src"
          rm -f build/ironkeeper
          # The release build is the same one `nimble build` drives.
          tools/build.sh
          ./build/ironkeeper --version

      - name: Record the executable identity
        run: |
          set -euo pipefail
          {
            echo "file: $(file build/ironkeeper)"
            echo "sha256: $(sha256sum build/ironkeeper | cut -d' ' -f1)"
            echo "size: $(stat -c %s build/ironkeeper)"
          } | tee executable-identity.txt
          cat executable-identity.txt

      # Diagnostics are collected after the gates have run, so that a
      # failure can be diagnosed without repository admin rights. They are
      # explicitly non-mandatory: they never influence the job conclusion.
      - name: Collect diagnostics
        if: always()
        run: |
          set -euo pipefail
          {
            echo '### Gate logs'
            echo '```'
            for f in gate-logs/*.log; do
              [ -e "$f" ] || continue
              echo "--- $f ---"
              cat "$f"
            done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the build evidence
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: build-evidence-${{ matrix.architecture }}
          path: |
            build/ironkeeper
            environment.txt
            executable-identity.txt
            dependency-resolution.txt
            gate-logs/
          retention-days: 7
          if-no-files-found: ignore

  # ---------------------------------------------------------------------
  # The validator qualification.
  #
  # The upstream conformance suite is large. It is not run for every
  # ordinary change: the decision is made by the repository-owned script
  # `tools/requalification_needed.sh`, from the paths that changed.
  # ---------------------------------------------------------------------
  validator-qualification:
    name: validator qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install the pinned Nim toolchain
        run: |
          set -euo pipefail
          # The same repository-owned bootstrap as the build job, so that
          # the toolchain is installed and put on PATH in exactly one way.
          # The verification is a separate step, because the bootstrap is
          # executed and its exported PATH does not survive it.
          tools/install_nim_toolchain.sh

      - name: Verify the pinned toolchain
        run: tools/verify_nim_toolchain.sh

      - name: Install the PCRE runtime dependency
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpcre3
          ldconfig -p | grep -i pcre

      - name: Resolve pinned dependencies
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/jschema"
          git clone --quiet https://github.com/Niminem/jschema.git \
            "$RUNNER_TEMP/jschema"
          git -C "$RUNNER_TEMP/jschema" checkout --quiet "${JSCHEMA_COMMIT}"
          actual=$(git -C "$RUNNER_TEMP/jschema" archive HEAD | sha256sum | cut -d" " -f1)
          test "${actual}" = "${JSCHEMA_TREE_SHA256}"
          mkdir -p "$HOME/.nimble/pkgs2/jschema-0.1.0"
          cp -R "$RUNNER_TEMP/jschema/src" "$HOME/.nimble/pkgs2/jschema-0.1.0/src"
          cp "$RUNNER_TEMP/jschema/LICENSE" "$HOME/.nimble/pkgs2/jschema-0.1.0/"
          cp "$RUNNER_TEMP/jschema/jschema.nimble" \
            "$HOME/.nimble/pkgs2/jschema-0.1.0/jschema.nimble"
          printf '%s\n' 'requires "jschema == 0.1.0"' \
            > "$HOME/.nimble/pkgs2/jschema-0.1.0/nimble.paths"
          echo "IRK_DEPS_PATH=$HOME/.nimble/pkgs2/jschema-0.1.0/src" \
            >> "$GITHUB_ENV"

      # The decision is made by the repository-owned script, not by a
      # path filter written in the workflow file.
      #
      # The event data is passed through the *environment*. It is never
      # interpolated into the shell source: an interpolated value would be
      # executable text, and an event field is not trusted input.
      - name: Decide whether requalification is required
        id: requalify
        env:
          # The comparison base. It may be empty, and it may be the
          # all-zero object id; the decision script treats both as a
          # missing comparison authority and requires the qualification.
          IRK_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          decision=$(bash tools/requalification_needed.sh "$IRK_BASE_SHA" \
            | tee /dev/stderr | grep '^requalification=' | head -1)
          echo "decision=${decision#requalification=}" >> "$GITHUB_OUTPUT"
          echo "base=${IRK_BASE_SHA}" >> "$GITHUB_OUTPUT"

      # The qualification step always runs. A green job whose
      # qualification step was skipped does not establish anything, and
      # the selective decision is a *cost* optimisation, not a gate.
      # The decision is still recorded, so that the cost optimisation can
      # be inspected afterwards.
      # The qualification must be **authoritative**: only a successful
      # verification against the repository-pinned inputs can produce
      # that classification. A caller-supplied digest produces a
      # development-only result, and the gate refuses it.
      - name: Qualify the validator
        env:
          IRK_QUALIFY_REQUIRE_AUTHORITATIVE: "1"
        run: |
          set -euo pipefail
          tools/qualify_validator.sh 2>&1 | tee qualification-output.txt
          grep -q '^qualification_authoritative=true$' qualification-output.txt
          grep -q '^qualification_classification=pinned-verified$' qualification-output.txt

      - name: Record the requalification decision
        env:
          IRK_DECISION: ${{ steps.requalify.outputs.decision }}
          IRK_BASE: ${{ steps.requalify.outputs.base }}
          IRK_HEAD: ${{ github.sha }}
        run: |
          {
            echo "decision: ${IRK_DECISION}"
            echo "base: ${IRK_BASE}"
            echo "head: ${IRK_HEAD}"
          } | tee requalification-decision.txt

      - name: Collect diagnostics
        if: always()
        run: |
          set -euo pipefail
          {
            echo '### Validator qualification'
            echo '```'
            for f in gate-logs/*.log; do
              [ -e "$f" ] || continue
              echo "--- $f ---"
              cat "$f"
            done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------
  # Secret scanning. Runs against the whole history, not just the tip.
  # ---------------------------------------------------------------------
  secret-scan:
    name: secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0

      # The gitleaks *binary* is used rather than the gitleaks action.
      # The binary is MIT licensed and needs no licence key, no token and
      # no organisation-level entitlement. The action is not used because
      # it requires a commercial licence for organisation-owned
      # repositories.
      - name: Install the pinned gitleaks binary
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gitleaks"
          cd "$RUNNER_TEMP/gitleaks"
          curl -fsSLO \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks_8.30.1_linux_x64.tar.gz" | sha256sum -c -
          tar xf gitleaks_8.30.1_linux_x64.tar.gz
          chmod +x gitleaks
          "$RUNNER_TEMP/gitleaks/gitleaks" version
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"

      # The scan verdict is decided by the gate script, which is
      # fail-closed: findings fail, a missing scanner fails, a scanner
      # that cannot execute fails, and a missing or malformed report is
      # never reported as a clean scan.
      - name: Scan the history for secrets
        env:
          GITLEAKS: ${{ runner.temp }}/gitleaks/gitleaks
        run: tools/gate_secret_scan.sh

      - name: Collect the scan diagnostics
        if: always()
        run: |
          set -euo pipefail
          {
            echo '### Secret scan'
            echo '```'
            if [ -f gitleaks-report.json ]; then
              head -c 4000 gitleaks-report.json
            else
              echo "(the scanner produced no report; see the gate log)"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
