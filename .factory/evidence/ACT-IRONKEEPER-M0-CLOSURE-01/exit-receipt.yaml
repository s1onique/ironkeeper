CI_BOOTSTRAP: |
  Root cause: the bootstrap appended the toolchain directory to `$PATH`
  with a redirection. PATH is a shell variable holding a colon-separated
  directory list, not an environment file, so the redirection created a
  file whose name was the whole value of PATH.
  Correction: tools/install_nim_toolchain.sh is now the single
  implementation of the bootstrap. It verifies the pinned version and the
  pinned sha256 of the distribution, checks that the extracted compiler is
  executable, exports PATH="$nim_bin:$PATH", appends the directory to
  "$GITHUB_PATH", and verifies the reported compiler version.
  Regression check: tools/gate_ci_bootstrap.sh (10 checks, all passing)
  drives the production script against a synthetic toolchain and asserts
  that the compiler is on PATH, that GITHUB_PATH carries the directory,
  that no file is created by writing to PATH, that a missing compiler is
  refused, and that a compiler with the wrong version is refused.

REQUALIFICATION_DECISION: |
  tools/requalification_needed.sh is fail-closed. A missing base, an
  empty base, the all-zero object id of a first push, an unresolvable
  base and a failing git diff all produce requalification=needed. The
  relevant-path policy covers the parser, the adapter, the schemas, the
  qualification harness, the qualification fixtures, the corpus and
  remote trees, the pinned dependency, the pinned toolchain, the
  qualification workflow and the decision script itself. Event data is
  passed through the environment, never interpolated into shell source.
  Regression check: tools/gate_requalification_decision.sh (21 checks, all
  passing) exercises the production script against temporary repositories.
  The workflow now runs the qualification step unconditionally, so a green
  job can never hide a skipped qualification.

CONFORMANCE_ACCOUNTING: |
  The raw upstream measurement and the adapter measurement are separate.
  A wrong raw answer to a mandatory case is a raw failure regardless of
  whether the case lies outside Ironkeeper's supported subset. An
  authorised limitation never turns a failure into a pass: it is the
  authority that lets the product qualification accept a raw failure that
  lies outside the required subset. The product verdict is PASS when the
  adapter measurement passed and every raw failure is an authorised
  limitation outside the required subset.
  Counting invariant: denominator = passed + failed for every reported
  measurement. A measurement with an empty denominator establishes
  nothing and cannot be a PASS.

EXCLUSION_AUTHORITY: |
  An exclusion is honoured only when it names an existing corpus case,
  carries a reason, is not duplicated, and names a case outside the
  required subset. A stale, duplicated, malformed or unauthorised entry
  is unusable evidence: it fails the qualification and never contributes
  to the denominator. Exclusions are never counted as passes.
  Witnesses: tools/validator_conformance_witnesses.nim demonstrates a
  wrong raw answer outside the adapter subset, an adapter refusal of an
  in-subset case, a stale exclusion naming a nonexistent case, an empty
  effective denominator, a correct mixed answer set, and an explicitly
  authorised policy exclusion. The always-accept, always-reject, inverted
  and execution-error witnesses remain mandatory and still fail the
  qualification.

CORPUS_AND_REMOTE_IDENTITY: |
  The qualification digest binds both consumed trees: the Draft 2020-12
  corpus and the remote schema tree.
    inputs_digest_sha256=45bf30e6bc639547d4b7a75fe152fce5451e523fa976ff82f0576e9c6fcd1322
    remote_schema_files=79
    remote_digest_fnv1a64=F18EE856D4C17EF4
  A remote schema that cannot be parsed is refused, not skipped. A
  caller-supplied digest override is a development convenience: the
  result is explicitly classified as non-authoritative unless the caller
  also states that the result is authoritative. Offline schema resolution
  is preserved. Regression check: tools/gate_remote_schema_integrity.sh
  (8 checks, all passing) uses a single synthetic remote-schema mutation
  to show that a changed remote input is detected.

UTF8_OUTPUT_BOUNDARY: |
  The output bounds are counted in code points, because the JSON Schema
  maxLength keyword counts code points. A cut is taken at a code point
  boundary, so a truncated value is always valid Unicode and every
  emitted document is valid UTF-8. The truncation marker fits inside the
  bound; a bound too small for the long marker uses the short marker.
  Invalid external text receives the explicit diagnostic representation
  "[invalid utf-8] " with U+FFFD in place of the invalid bytes. A
  shortened stable code carries the truncation marker, so it cannot be
  read as an unrelated code.

TRUNCATION_ACCOUNTING: |
  kept = maximum_items - 1 when the collection is truncated, and
  dropped = original_count - kept. A collection of 1024 findings is not
  truncated; a collection of 1025 findings keeps 1023 findings, drops 2,
  and carries the marker. The same invariant applies to the validation
  issue collection. A truncated report cannot carry an unsupported PASS
  claim: the verdict is not PASS when findings were dropped, and the
  semantic layer rejects an external document that pairs PASS with a
  truncated findings collection.

