NON_VACUITY: |
  The predecessor's verifier (the file at the entry commit) was
  restored over the corrected one and the regression witness was run:
    witness exit status with the predecessor's verifier: 1
    passed: 17  failed: 6
  The failing checks included "the verification step succeeds on the
  production path", "nim resolves to the intended toolchain" and
  "nimble resolves to the intended toolchain" - the exact symptom the
  remote runs show. The corrected verifier was then restored and the
  witness re-run:
    witness exit status with the corrected verifier: 0
    passed: 23  failed: 0
  The witness therefore detects the defect it exists to detect.

