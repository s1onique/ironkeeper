STEP_FILE_LIFECYCLE_RED: |
  GITHUB_PATH is a per-step environment-command file. The installation
  step writes to its own file; the runner consumes it and updates the
  PATH of the following steps; the verification step receives a new,
  empty file. The predecessor's verifier reconstructed the installation
  directory from the last entry of the *current* file, so it found
  nothing and refused the correctly populated PATH.
  The remote evidence agrees. Runs 45934380741 and 45934374904 both
  executed 9e1d49ce1ac0fdc8d8171ab99f6f23eafa0fcf52 and both failed at
  the step "Verify the pinned toolchain": the secret scan succeeded, the
  native amd64 build and test, the native arm64 build and test and the
  validator qualification all failed at that step.
  The defect is reproduced locally by the regression witness: with the
  predecessor's verifier the witness fails, including the check
  "the verification step succeeds on the production path" (17 of 23
  checks pass, 6 fail, exit status 1).

STEP_FILE_LIFECYCLE_GREEN: |
  The installation directory is derived from the deterministic
  installation path the bootstrap establishes:
    intended="${IRK_NIM_TOOLCHAIN_DIR:-}"
    if [[ -z "$intended" ]]; then
      : "${RUNNER_TEMP:?RUNNER_TEMP is required}"
      intended="$RUNNER_TEMP/nim/nim-${NIM_VERSION}/bin"
    fi
  The bootstrap installs into exactly that path
  (nim_bin="$RUNNER_TEMP/nim/nim-${NIM_VERSION}/bin"), so the two cannot
  disagree. The verifier still requires both nim and nimble to resolve to
  that directory and the compiler to report exactly the pinned version.
  The development override remains available for synthetic testing.
  The regression witness exercises the production path end to end: a
  synthetic toolchain under the deterministic installation path, the
  bootstrap executed in a child process, the installation step's file
  consumed to establish the effective PATH, a fresh empty file for the
  verification step, no development override in the verification
  environment, and the actual production verifier. It passes.

