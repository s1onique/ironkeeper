M0_ACCEPTANCE: accepted on the basis of the qualified identical tree (commit b85fa0bb9b7f50e3ce170cf6ab9ae776207a4336, CI runs 45935432045 and 45935427044, all four jobs successful; no changed files between the qualified commit and main c2c34e34721fced22080a3b6ead6d7c3c77041bd). The later main run 45935586165 failed only in the amd64 dependency-installation step because packages.microsoft.com returned HTTP 403; classified as an external environment failure, the other three jobs succeeded.
DISCOVERY_SCOPE: passive Linux discovery from /sys/class/block, /sys/dev/block, /run/udev/data and /dev/disk/by-{id,path}; no device is opened and no tool is run; physical, partition, device_mapper, raid, loop, ram, optical, virtual and unknown are distinguished; the 512-byte sector convention is applied with checked exact arithmetic; a missing discovery root is an explicit failure, never a successful empty inventory.
IDENTITY_AUTHORITY: authoritative when a persistent world-wide name is observed, probable for a serial-only identity, ambiguous on contradictory or duplicated observations, unresolved otherwise; an ambiguous identity refuses the active interrogation; no durable identity registry and no persistent enrollment state are introduced in M1.
MULTIPATH_LIMITATIONS: the observed paths are retained and an ambiguous arrangement refuses the active interrogation; a multipath device is not probed once per alias and no multipath map is built (IRK-05 owns the ownership model).
HANDLE_BOUND_IDENTITY_LIMITATIONS: the tools are executed by pathname, so the pre/post identity fingerprint comparison narrows but does not close the time-of-check/time-of-use race; a detected change refuses the attribution of the observations; handle-bound authority for intrusive operations remains a mandatory IRK-05/IRK-07 gate.

STORAGE_CONTRACTS: schemas/v1/inventory.schema.json, device.schema.json, observation.schema.json and evidence.schema.json, version 1, Draft 2020-12, unknown properties rejected at every authoritative boundary, embedded byte-for-byte, meta-validated, policy-checked and independently cross-checked in CI.
EXTERNAL_JSON_INGESTION: a separate lossless reader (src/ironkeeper/storage/externaljson.nim) that preserves the raw bytes, validates the encoding and the syntax, detects duplicate member names before information is lost, keeps the exact source lexeme of every number, verifies the companion representations where they are consumed, and never repairs an external member name.
EXACT_COUNTER_HANDLING: exact decimal string arithmetic on the digits; the internal numeric domain was not widened; a counter beyond 2^53 and beyond 64 bits keeps every digit; the internal contracts carry such a value as a canonical decimal string.
UTF8_KEY_AUTHORITY: an external member name that is not valid UTF-8 causes the document to be rejected, never repaired; names are compared after JSON unescaping; two spellings of the same name are rejected as a duplicate; the foundation's collision follow-up is closed at this boundary.

BACKEND_EXECUTION: one boundary (src/ironkeeper/storage/procexec.nim); absolute paths, argument vectors, a controlled environment with a fixed locale, separately and independently bounded stdout and stderr, concurrent draining, a monotonic deadline, process-group termination, reaping, and five distinct outcome classifications; 30 s deadline, 4 MiB stdout, 256 KiB stderr, concurrency one.
SMART_EXIT_STATUS_AUTHORITY: all eight bits of the smartctl bitmask are decoded and the original numeric status is preserved; bit 3 is a device-reported health observation and not a collection failure; a status embedded in the document that contradicts the process status is reported as a contradiction; the ATA bit meanings are not assumed to apply identically to SCSI and NVMe.
SAS_OBSERVATIONS: implemented and live-verified - identity, capacity and block sizes, rotation rate, device-reported health, current and trip temperature, power-on time, start-stop and load-unload counters, grown defect count, corrected and uncorrected read/write/verify errors, correction algorithm invocations (kept distinct from the corrected-error counts), processed data, non-medium errors, self-test log entries, background scan count.
SATA_OBSERVATIONS: implemented and fixture-verified - identity and firmware, device-reported health, temperature, power-on hours, power-cycle count, the presence of the attribute table; the attribute records themselves are not turned into a universal ontology and no endurance percentage is invented.
NVME_OBSERVATIONS: implemented and fixture-verified - controller and namespace identity, critical warning, temperature, available spare and threshold, percentage used, data units read and written in their original unit, host read and write commands, power cycles, power-on hours, unsafe shutdowns, media errors, error log entry count; the health log is attributed to the controller and never presented as namespace-specific.
SCSI_PROTECTION_MAPPING: PROT_EN 0 -> type_0; PROT_EN 1 with P_TYPE 0/1/2 -> type_1/type_2/type_3; PROT_EN 1 with P_TYPE 3-7 -> reserved_unsupported; both raw fields are retained and a reserved combination is never silently mapped; every row of the mapping has a fixture.
SAS_PHY_OBSERVATIONS: the per-PHY negotiated link rate, invalid DWORD count, running disparity errors, loss of DWORD synchronisation, PHY reset problems, SAS addresses and attached PHY identifier are preserved per port and per PHY; the counters are never reset and never aggregated across unrelated PHYs; the expander graph is not built (IRK-12 partial).

CLI_STATUS: inventory list and device inspect with --wwn, --serial and --path; the JSON mode emits exactly one authoritative document on stdout and the diagnostics go to stderr; the passive commands run no tool; an active interrogation requires --allow-wake; an ambiguous selector is refused; a successfully acquired observation of an unhealthy device exits successfully; no PASS or admission verdict is ever displayed.
RAW_EVIDENCE_EXPORT: an invocation-scoped directory below the operator-supplied parent; a unique name avoids any collision; a caller-owned file is never overwritten and a caller-owned directory is never removed; the files carry restrictive permissions; the manifest is published after the artefacts are finalised and records the exact byte length and the SHA-256 digest of each; a digest is an integrity check and not a proof of provenance.
CONTRACT_VALIDATION: the generated inventory and observation documents validate against the repository contracts with the independent validator (check-jsonschema 0.31.2), locally and in CI; the live documents of the lab host validate as well.
REGRESSION_WITNESSES: 25 invariant witnesses are recorded in regression-witnesses.md, exercised by the production code path (tests/unit/storage_tests.nim, tests/integration/storage_cli_tests.nim, tests/contract/schema_contract_tests.nim).
NON_VACUITY: tools/gate_storage_non_vacuity.sh reverses six critical checks (identity conflict refusal, exact counter precision, the missing-counter default, the backend deadline, the SMART bitmask, the SCSI protection mapping) and shows that the corresponding witness fails in every case; the restored implementation is green; the gate runs in CI.

