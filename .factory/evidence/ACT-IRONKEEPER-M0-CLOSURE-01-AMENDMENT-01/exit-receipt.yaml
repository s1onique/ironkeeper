BOOTSTRAP_INTEGRATION: |
  Defect: the bootstrap is *executed*, so its exported PATH belongs to
  the child process and does not survive the script. The workflow ran
  the bootstrap and the toolchain verification in one shell, so the
  verification found nothing on PATH and failed with exit 127.
  Correction: tools/install_nim_toolchain.sh stays executable and keeps
  writing the toolchain directory to $GITHUB_PATH. The verification is
  now the separate step tools/verify_nim_toolchain.sh, which resolves
  the intended directory from the last entry of $GITHUB_PATH and
  requires both nim and nimble to resolve to it, so an unrelated
  preinstalled compiler or package manager cannot satisfy the gate. The
  official archive and digest pins are unchanged.
  Witness: tools/gate_ci_bootstrap.sh exercises the production
  invocation boundary - the script is executed, not sourced - and the
  verification runs as the following workflow step does, through
  GITHUB_PATH. 17 checks, all passing.

EXACT_VERSION_CHECK: |
  Defect: the version was compared with a shell glob, so a compiler that
  merely starts with the pinned version passed. The review reproduced
  expected 9.9.9 against reported 9.9.90 with a bootstrap exit of 0.
  Correction: the version token is extracted from the compiler's own
  output and compared as a whole, in both the bootstrap and the
  verification step.
  Witnesses: a correct pinned version succeeds; a prefix-matching but
  incorrect version (9.9.90 against 9.9.9) fails the bootstrap and
  names the mismatch; a missing compiler fails; a missing nimble fails
  the toolchain verification; and the following workflow step resolves
  the intended toolchain.

QUALIFICATION_AUTHORITY: |
  Defect: the qualification read IRK_QUALIFY_EXPECTED_INPUTS_DIGEST and
  IRK_QUALIFY_AUTHORITATIVE, so a caller could substitute corpus
  contents and still obtain an authoritative classification.
  Correction: the authority is decided by the verification and by
  nothing else. Only a successful comparison against the
  repository-pinned digest produces qualification_authoritative=true.
  A caller-supplied digest produces a development-only result; there is
  no environment variable that can promote it, and the script no longer
  reads an authority assertion at all. The production CI gate sets
  IRK_QUALIFY_REQUIRE_AUTHORITATIVE=1 and refuses a non-authoritative
  result.
  Witnesses, in tools/gate_remote_schema_integrity.sh: a modified input
  with the repository pin is refused and is not classified as
  authoritative; a modified input with a caller-supplied matching digest
  is non-authoritative and classified as a development override; a
  caller cannot promote that result; and the production gate refuses
  it. 19 checks, all passing.

EXTERNAL_TRUNCATED_REPORT_SEMANTICS: |
  Defect: the closure receipt claimed that an external report pairing
  PASS with a truncated findings collection is rejected, but the
  production semantic validator held no such rule.
  Correction: src/ironkeeper/contracts/reportsemantics.nim rejects a
  report that carries the findings.truncated marker and claims a PASS
  assessment, with the code report.pass_with_truncated_findings. The
  producer-side downgrade and the truncation accounting are preserved.
  Witness: the actual compiled `report validate --json` command is
  exercised with a structurally valid synthetic report - a truncated
  report with PASS is rejected as a semantic failure (exit 6) and the
  reason is named; the same report with WARN is accepted. The witness
  was shown to be non-vacuous: with the rule disabled the integration
  suite fails, and with the rule restored it passes.

