OPEN_FINDINGS: |
  1. The subject has no native CI run. One bounded authentication
     preflight was performed, as the amendment permits:
         git push --dry-run origin act/ironkeeper-foundation-01-amendment-03
     and it failed with
         git@github.com: Permission denied (publickey).
         fatal: Could not read from remote repository.
     No further authentication attempt was made, and no credential
     store, keychain, private key or unrelated repository was searched.
     The acceptance gates that depend on a native run - C08 (native
     Linux amd64 build and tests), C09 (native Linux arm64 build and
     tests), C10 (secret scan) and the native part of C11 - are unmet.
  2. Operator action, exactly:

         git push origin act/ironkeeper-foundation-01-amendment-03

     The push triggers the native Linux amd64 and arm64 build-and-test
     jobs, the secret-scan gate and the validator-qualification job.
     The qualification step executes unconditionally and the gate
     requires an authoritative qualification, so a green job cannot hide
     a skipped or development-only qualification.
  3. The three nonblocking follow-ups are recorded on the board: an
     actual failing-diff injection for the selective requalification
     decision; collision-safe UTF-8 handling of arbitrary object keys
     before external telemetry ingestion; and further qualification
     optimisation only after M1.
