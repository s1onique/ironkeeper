PRODUCTION_TEST_SEAM_ISOLATION: VERIFIED - the tool and the discovery-root
  seams are a compile-time property; the production binary does not read
  them, and the marker witness proves that it does not execute the marker
  executable
PROCESS_EXECUTION_AUTHORITY: VERIFIED - the poll descriptors carry the
  identity of their stream, a failed launch is distinguished from an exit
  status of 127, the deadline stays authoritative after the pipes reach
  end of file, and an unreaped child is reported as an unresolved process
  state
DEVICE_ATTRIBUTION_AUTHORITY: VERIFIED - the disappearance, the
  replacement, the failed rediscovery and the contradictory tool identity
  all refuse the attribution, and a detected change prevents the
  subsequent active commands
ACQUISITION_COMPLETENESS: VERIFIED - the completeness follows the
  requested observation coverage and not the presence of an execution
  record; the same value is carried by the observation document, the
  evidence manifest, the human output and the exit status
SMART_EXIT_BITMASK: VERIFIED - the eight bits carry the upstream
  definitions of smartmontools/smartctl.h, and a status that no process
  produced is never decoded as a bitmask
SMART_NUMERIC_COMPANIONS: VERIFIED - the companions are the real KEY_s
  and KEY_le ones; the agreement, the disagreement, the valid and the
  contradictory little-endian companion, the malformed companion, the
  128-bit counter and the unrelated vendor field are all witnessed
EXACT_CAPACITY_ARITHMETIC: VERIFIED - the last logical block address 999
  with a block length of 512 is 512000 bytes, and every trailing zero is
  a significant digit
SCSI_PROTECTION_EVIDENCE: VERIFIED - a missing, an invalid and a
  reserved protection state are distinguished from an observed disabled
  protection, and Type 0 is derived only from an observed PROT_EN of zero
DEVICE_IDENTITY_AUTHORITY: VERIFIED - the kernel and the udev
  observations are compared rather than merged, an unusable identifier
  earns no authority, and a shared NVMe controller serial is not a
  contradiction
EVIDENCE_DIRECTORY_OWNERSHIP: VERIFIED - the directory is created
  exclusively with restrictive permissions, every artefact is created
  exclusively, the parent identity is checked before and after the
  export, and the manifest is published last
RUNTIME_CONTRACT_VALIDATION: VERIFIED - the inventory document, the
  observation document and the evidence manifest are validated against
  the repository contracts at the production boundary, and the stored
  observation document agrees with the emitted document
PUBLIC_HISTORY_PRIVACY: UNRESOLVED - private identifiers remain in the
